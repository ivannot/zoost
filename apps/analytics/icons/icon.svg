<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Zoost for Zoho Analytics.
       Built on the CRM mark's grid, measured from it rather than redrawn by eye: the Z is the same
       52x48 box at the same 14px bar weight, so the two read as one family and neither looks like a
       worse drawing of the other. It sits left of centre to make room for three columns rising to
       the tile's baseline; the pair is centred as a whole.
       Teal against the CRM's blue is what actually tells them apart in the toolbar — at 16px the
       columns are texture, not a motif, and the hue is doing all the work. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#0e9488"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#g)"/>
  <g fill="#fff">
    <!-- the Z: same dimensions as the CRM mark, shifted left -->
    <rect x="20" y="40" width="52" height="14" rx="3"/>
    <polygon points="72,54 38,74 20,74 54,54"/>
    <rect x="20" y="74" width="52" height="14" rx="3"/>
    <!-- three columns on the Z's own baseline, stepping up -->
    <rect x="80" y="66" width="8" height="22" rx="2" opacity=".55"/>
    <rect x="92" y="54" width="8" height="34" rx="2" opacity=".75"/>
    <rect x="104" y="40" width="8" height="48" rx="2"/>
  </g>
</svg>
