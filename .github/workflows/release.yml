# Build the package that gets submitted to the Chrome Web Store, on a machine nobody owns.
#
# The point is to remove the author from the chain. Until now the build happened on a laptop and the
# file was uploaded from there, so a reviewer had to take it on trust that the upload came from the
# tagged commit. Reproducibility helps only if someone independent actually rebuilds — and nobody
# does that spontaneously.
#
# So: pushing a tag `crm-v*` or `analytics-v*` makes GitHub check out that exact commit, build it,
# prove the build is deterministic by doing it twice, publish the archive as a Release asset, and
# sign a provenance statement binding the artifact to this workflow file, this repository and that
# commit. The log is public. The attestation is verifiable with one command and no trust in us.
#
# What the author still does by hand — and cannot be automated away — is upload the file to Google.
# The discipline that keeps the chain intact is therefore: **upload the asset from the Release, never
# a local build.** RELEASES.md says so, and the hash in the Release body is what makes a swap
# detectable.
# Every action below is pinned to a commit hash, not to a moving tag. `@v2` is a ref its owner can
# repoint at any time — a supply chain that ends in "and then whatever that tag says today" is not
# one. The trailing comment records which release each hash was, so upgrading stays a deliberate,
# reviewable edit. Resolve a new one with:
#   curl -s https://api.github.com/repos/<owner>/<repo>/git/ref/tags/<tag>
#
name: release

on:
  push:
    tags:
      - 'crm-v*'
      - 'analytics-v*'
  # A tag-triggered run executes the copy of this file that the *tag* points at, so a breakage in it
  # can only be fixed by moving a published ref - which this repository refuses to do. Dispatching
  # runs the version on the default branch against a tag that already exists, which is how 1.40.0 was
  # published after GitHub moved its runners to Node 24 and the release action stopped working.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. crm-v1.40.0'
        required: true
        type: string

permissions:
  contents: write        # create the Release and attach the archive
  id-token: write        # mint the OIDC token the attestation is signed with
  attestations: write    # record the provenance statement

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `ref` matters on a dispatched run: without it checkout takes the default branch, and the
      # workflow would build whatever main happens to hold under the name of a tag. It has to be the
      # tagged commit or the archive is a lie.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The whole history, because the gate below runs the battery and two of its checks are
          # *derived from git*: the sitemap's lastmod per file, and what whatsnew reports since a
          # tag. A depth-1 checkout has neither, so both failed here while passing on every machine
          # with a clone - the first release to run the gate died on it. `fetch-depth: 0` costs a few
          # seconds; the alternative is a check that only pretends to run.
          fetch-depth: 0

      - name: Read the app and version out of the tag
        id: tag
        run: |
          # GITHUB_REF_NAME is the branch on a dispatched run, so the input wins where there is one.
          TAG="${{ inputs.tag || github.ref_name }}"
          case "$TAG" in
            crm-v*|analytics-v*) ;;
            *) echo "::error::$TAG is not <app>-v<version>"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # The commit that was checked out, never github.sha: on a dispatched run that is the head
          # of the branch the workflow was launched from, so the first dispatch published a Release
          # whose provenance named main instead of the tag. The bytes were right - the hash matched a
          # local build of the tagged commit - and the sentence describing where they came from was
          # wrong, which in a chain whose whole point is provenance is the worse half.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          APP="${TAG%%-v*}"
          VERSION="${TAG#*-v}"
          echo "app=$APP"         >> "$GITHUB_OUTPUT"
          # The product's real name, read from the manifest, which is the authority on it. Two earlier
          # versions of this line invented one instead: "Zoost for crm 1.9.0" took the directory name,
          # and the case statement that replaced it fixed the platform while leaving "Zoost for …" —
          # a fourth name form the project has explicitly banned, on the most public surface there is.
          # A copy of a name is a name that drifts; there is nothing to keep in step now.
          PRODUCT=$(python3 -c "import json,sys; print(json.load(open('apps/$APP/manifest.json'))['name'])")
          echo "product=$PRODUCT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=dist/zoost-$APP-$VERSION-store.zip" >> "$GITHUB_OUTPUT"

      - name: The tag must agree with the manifest
        run: |
          # A tag that says one version while the manifest says another would make the whole record
          # meaningless, so it is a hard stop rather than a warning.
          MANIFEST=$(python3 -c "import json;print(json.load(open('apps/${{ steps.tag.outputs.app }}/manifest.json'))['version'])")
          if [ "$MANIFEST" != "${{ steps.tag.outputs.version }}" ]; then
            echo "Tag says ${{ steps.tag.outputs.version }}, apps/${{ steps.tag.outputs.app }}/manifest.json says $MANIFEST."
            exit 1
          fi

      - name: The suite and the claims, before anything public exists
        run: |
          # These run in tools/release.sh too, and that was the whole of it: the gates lived on the
          # machine that types the tag. `git tag && git push --follow-tags` from muscle memory, or
          # from a checkout that never ran them, and CI would publish a signed Release of a commit
          # nobody had verified - provenance guaranteed by the machine, quality by convention.
          # Two minutes here makes them unskippable. Reported in a review of the chain.
          bash tests/run.sh
          python3 tools/auditcheck.py --before-tag

      - name: Build twice and prove the two are identical
        id: build
        run: |
          ./build.sh "${{ steps.tag.outputs.app }}"
          A=$(sha256sum "${{ steps.tag.outputs.zip }}" | cut -d' ' -f1)
          ./build.sh "${{ steps.tag.outputs.app }}"
          B=$(sha256sum "${{ steps.tag.outputs.zip }}" | cut -d' ' -f1)
          echo "first  $A"
          echo "second $B"
          if [ "$A" != "$B" ]; then
            echo "The build is not reproducible. A published hash would be a number nobody can check."
            exit 1
          fi
          echo "sha256=$A" >> "$GITHUB_OUTPUT"

      - name: What is actually in the package
        run: |
          # Printed into the public log on purpose: the archive is plain readable source, no bundler
          # and no minifier, and this is where anyone can see that for themselves.
          unzip -l "${{ steps.tag.outputs.zip }}"

      - name: Sign a provenance statement for the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-path: ${{ steps.tag.outputs.zip }}

      # What changed, ahead of how it was built. The body this workflow writes answers "is this
      # archive what it claims to be"; it never answered "what am I getting", and the Chrome Web
      # Store has no field for that either — so the Release is the only place it can be published.
      # Two readers, in this order and separated: whoever wants to know what changed reads the notes
      # and stops at the rule; whoever wants the hash skips to `## Provenance`. Mixed together, each
      # of them reads the other's half looking for their own.
      # Missing notes fail the run rather than publishing a Release without them: tools/release.sh
      # refuses to tag without the file, so reaching here without one means the tag bypassed it.
      # The whole body is assembled here and handed over as one file. `body` and `body_path` together
      # are ambiguous — one of them wins and which is not worth depending on — so only `body_path` is
      # passed and there is nothing to get wrong.
      - name: Assemble the Release body
        id: notes
        env:
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          COMMIT: ${{ steps.tag.outputs.commit }}
          REPO: ${{ github.repository }}
          REF: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="store/$APP/whatsnew/$VERSION.md"
          if [ ! -s "$NOTES" ]; then
            echo "No release notes at $NOTES. tools/release.sh refuses to tag without them," >&2
            echo "so this tag bypassed it. Write the file and re-tag." >&2
            exit 1
          fi
          BODY="$RUNNER_TEMP/body.md"
          cat "$NOTES" > "$BODY"
          cat >> "$BODY" <<EOF

          ---

          ## Provenance

          Built by GitHub Actions from \`$COMMIT\`, not on anyone's laptop.

          \`\`\`
          package  zoost-$APP-$VERSION-store.zip
          sha256   $SHA256
          commit   $COMMIT
          \`\`\`

          **The asset attached here is the file submitted to the Chrome Web Store.** Nothing is
          rebuilt in between.

          Verify it yourself, without trusting us:

          \`\`\`bash
          # 1. the archive really came from this repository, this workflow, this commit
          gh attestation verify zoost-$APP-$VERSION-store.zip \\
             --repo $REPO

          # 2. and the same source produces the same bytes on your machine
          git clone https://github.com/$REPO && cd zoost
          git checkout $REF
          ./build.sh $APP
          sha256sum dist/zoost-$APP-$VERSION-store.zip
          \`\`\`

          The row for \`RELEASES.md\`:

          \`\`\`
          | $APP | $VERSION | \`$REF\` | \`$COMMIT\` | \`$SHA256\` |
          \`\`\`
          EOF
          echo "path=$BODY" >> "$GITHUB_OUTPUT"

      # `gh`, not an action. softprops/action-gh-release is JavaScript, and when GitHub deprecated
      # Node 20 and started forcing Node 24 it began failing with «self-signed certificate» on a
      # runner nobody had touched - the build, the double-build comparison and the attestation all
      # passed, and only the publish died. gh is a Go binary preinstalled on the runner, it is not
      # a dependency this repository has to pin or trust, and it cannot break the same way.
      #
      # `--clobber` so a dispatched re-run replaces the asset instead of refusing, which is what
      # makes this step safe to run twice against the same tag.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='${{ steps.tag.outputs.tag }}'
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            # Upload first, edit second. The other way round failed with «release not found» on the
            # upload: `gh release upload` alone against the same release works, so what breaks it is
            # doing it immediately after an edit. Measured rather than reasoned about - the asset was
            # downloaded and pushed back with --clobber by hand, and it succeeded.
            gh release upload "$TAG" --repo '${{ github.repository }}' \
              '${{ steps.tag.outputs.zip }}' --clobber
            gh release edit "$TAG" --repo '${{ github.repository }}' \
              --title '${{ steps.tag.outputs.product }} ${{ steps.tag.outputs.version }}' \
              --notes-file '${{ steps.notes.outputs.path }}'
          else
            gh release create "$TAG" --repo '${{ github.repository }}' \
              --title '${{ steps.tag.outputs.product }} ${{ steps.tag.outputs.version }}' \
              --notes-file '${{ steps.notes.outputs.path }}' \
              '${{ steps.tag.outputs.zip }}'
          fi
