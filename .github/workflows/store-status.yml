# Ask Google what the Store is serving, and put the answer in Workers KV for the site to read.
#
# The point is not the answer, it is where the key is not. The Worker used to ask the Chrome Web
# Store API directly, which put a service-account key in Cloudflare as a Secret that request-handling
# code could read - and that key can publish, because Google links one service account per publisher
# and offers no narrower grant. Read-only was what the Worker *asked for*, never what the credential
# could do. Asking from here leaves the key in the one place it already had to be: the GitHub secret
# `store-upload.yml` needs to stage a draft.
#
# **It writes to KV rather than committing a file, and the reason is a defect the file caused.**
# Anything under `site/` is a build watch path, so committing the reading redeployed the whole site
# whenever Google moved a number - and `siteUpdated` in the footer is that deploy's own timestamp, so
# the site would have announced itself updated because a version somewhere else changed. KV takes the
# reading out of the deploy path, and lets `asOf` refresh on every run instead of only when the
# numbers move: a workflow that quietly stopped is then a date that stopped advancing, which
# /emergency prints for the reader to weigh.
#
# The two credentials are deliberately unequal. `CWS_SERVICE_ACCOUNT` can publish an extension;
# `CF_KV_TOKEN` is scoped to Workers KV Storage and can do nothing but write this reading. The one
# that can do damage never leaves GitHub.
#
# The schedule is frequent because the moment that matters is short: a review clearing is exactly
# when the site should stop saying a version is ahead of the Store. 48 writes a day against a free
# plan that allows 1,000 - checked before choosing the interval, not after.
name: store status

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  # After a package has been staged, because that is the other moment the answer changes: a
  # submission appears in `submitted` the same hour it is uploaded.
  workflow_run:
    workflows: ['store upload']
    types: [completed]

# Nothing is committed any more. The job reads a secret and writes to Cloudflare; it has no business
# with the repository beyond checking itself out.
permissions:
  contents: read

# Two runs would write the same key with two readings and the later start could land first. Nothing
# here has to catch up - the next tick is thirty minutes away - so they are serialised.
concurrency:
  group: store-status
  cancel-in-progress: false

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Ask the Store
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
        # Writes nothing on failure: `storestatus.py` exits non-zero if Google cannot be asked or
        # answers something that is not a version, so the step goes red before the file exists and
        # the reading already in KV stands. A wrong number is worse than an old one.
        run: |
          set -euo pipefail
          python3 tools/storestatus.py --out status.json
          cat status.json

      - name: Put it in KV
        env:
          CF_KV_TOKEN: ${{ secrets.CF_KV_TOKEN }}
        # Account and namespace are ids out of a dashboard URL, not secrets - the same reasoning as
        # the publisher id in `tools/cws.py`. The token is the secret, and it is scoped to KV alone.
        run: |
          set -euo pipefail
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/11a76c6cd17bc67e7e6dc872036546bb/storage/kv/namespaces/7bccd32413744db3a7cf9d90c9396bc7/values/status" \
            -H "Authorization: Bearer $CF_KV_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @status.json)
          cat resp.json; echo
          # Cloudflare answers 200 with `"success": false` for some refusals, so the status code is
          # not enough on its own - a job that went green over a rejected write would leave the site
          # serving a stale reading and say nothing.
          test "$code" = 200
          python3 -c "import json,sys; sys.exit(0 if json.load(open('resp.json')).get('success') else 1)"
